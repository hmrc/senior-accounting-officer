info:
  name: (202) missing-idempotency-key
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v2/notification"
  headers:
    - name: Authorization
      value: "{{authorization}}"
    - name: correlationId
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "companies": [
          {
            "crn": "65476489",
            "utr": "1233456679",
            "name": "TestCompanyName",
            "accPeriodEnd": "2009-09-09",
            "status": "Dormant",
            "type": "LTD"
          }
        ],
        "saos": [
          {
            "name": "Testname",
            "fromDate": "2020-03-10",
            "toDate": "2021-03-10"
          }
        ],
        "remarks": "testremarks"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 202) {
          bru.setVar('notificationGeneratedIdempotencyKey', res.body.idempotencyKey);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
