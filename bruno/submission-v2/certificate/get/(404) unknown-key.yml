info:
  name: (404) unknown-key
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v2/certificate/qa-unknown-{{$randomUUID}}"
  headers:
    - name: Authorization
      value: "{{authorization}}"
    - name: correlationId
      value: "{{$randomUUID}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
