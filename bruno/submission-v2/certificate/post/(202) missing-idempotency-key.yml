info:
  name: (202) missing-idempotency-key
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v2/certificate"
  headers:
    - name: Authorization
      value: "{{authorization}}"
    - name: correlationId
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "submitterName": "Submittername",
        "saoName": "SubmitterTestName",
        "saoEmail": "test@email.com",
        "companies": [
          {
            "crn": "12435678",
            "utr": "1243567843",
            "name": "companyname",
            "accPeriodEnd": "2010-10-10",
            "status": "Dormant",
            "type": "LTD",
            "isCorporationTaxQualified": false,
            "isVatQualified": true,
            "isPayeQualified": true,
            "isInsurancePremiumTaxQualified": true,
            "isStampDutyLandTaxQualified": true,
            "isStampDutyReserveTaxQualified": true,
            "isPetroleumRevenueTaxQualified": true,
            "isCustomsDutiesQualified": true,
            "isExciseDutiesQualified": true,
            "isBankLevyQualified": true,
            "qualificationStatement": "test statement"
          }
        ],
        "remarks": "Testremarks"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 202) {
          bru.setVar('certificateGeneratedIdempotencyKey', res.body.idempotencyKey);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
